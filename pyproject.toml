[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam2-annotator"
version = "0.1.0"
description = "Point-prompted SAM 2.1 annotator for semantic segmentation masks with user-defined classes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marwen Dhifi" }]
dependencies = [
    "sam2>=1.1",
    "torch>=2.3",
    "PySide6>=6.6",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.scripts]
sam2-annotator = "sam2_annotator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
